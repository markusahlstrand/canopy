name: Deploy to Substrat

# Generated by Substrat (substrat init --ci github). The workflow this encodes — one prod
# channel, previews as the only non-prod environment — is documented at
# https://substrat.net/guide/environments-and-previews
#
# Monorepo: this deploys the 'drive-vertical' vertical from apps/drive-vertical/. Dependencies still install
# at the repo root (the workspace lockfile lives there), and the workspace packages this
# vertical imports are built before every push — a sibling resolves through its dist/.
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   SUBSTRAT_TEST_SCOPE_ID      a long-lived scope rebound to every merge (the test env)
#   SUBSTRAT_PER_BUILD_PREVIEW  set to 1 to also mint a frozen per-build preview URL per push

# The default GITHUB_TOKEN, narrowed to what these jobs actually use. A repository whose
# default is read/write would otherwise hand every job below write access to issues, packages
# and the contents of the repo — none of which any of them touch. The one job that needs more
# elevates for itself: `preview` declares `pull-requests: write` to leave its comment.
permissions:
  contents: read

on:
  push:
    branches: [main]
    # Only changes that can affect apps/drive-vertical deploy it. If this package depends on other
    # directories of the repo (workspace packages, shared config), add their paths here —
    # or remove the filter to build on every merge.
    paths:
      - 'apps/drive-vertical/**'
      # The workspace packages the vertical BUNDLES. Without them a change to the drive
      # module itself — its operations, its schema — is neither previewed nor deployed,
      # and the worker keeps serving the last bundle until something under
      # apps/drive-vertical happens to change. Found when a PR adding two operations to
      # @canopy/scope-drive produced no preview at all.
      - 'packages/scope-drive/**'
      - 'packages/docworker/**'
      - 'packages/ui/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - 'package-lock.json'
  # Per-PR previews: open/update a PR → a preview instance running the PR's code against a
  # FORK of prod on its own URL; close the PR → it is reaped (the TTL is the GC backstop).
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # Only changes that can affect apps/drive-vertical deploy it. If this package depends on other
    # directories of the repo (workspace packages, shared config), add their paths here —
    # or remove the filter to build on every merge.
    paths:
      - 'apps/drive-vertical/**'
      # The workspace packages the vertical BUNDLES. Without them a change to the drive
      # module itself — its operations, its schema — is neither previewed nor deployed,
      # and the worker keeps serving the last bundle until something under
      # apps/drive-vertical happens to change. Found when a PR adding two operations to
      # @canopy/scope-drive produced no preview at all.
      - 'packages/scope-drive/**'
      - 'packages/docworker/**'
      - 'packages/ui/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'yarn.lock'
      - 'package-lock.json'

jobs:
  deploy:
    # Trunk-based: every merge to main releases. A private vertical's push lands admitted
    # and prod is self-serve, so the same run points prod at the new version.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One promotion at a time, and every merge still gets one. Two merges landing together
    # would otherwise race, and the loser could point prod at the OLDER version — the channel
    # takes whichever push finishes last, not whichever commit is newer. Queued rather than
    # cancelled: a superseded deploy is still a version somebody has to be able to find, and
    # cancelling mid-push can leave a version uploaded but never promoted. `queue: max`
    # because the default (`queue: single`) holds ONE run pending, so a third merge arriving
    # evicts the second and that commit is never deployed at all — the same lost promotion the
    # group was added to prevent, reached from the other side. Up to 100 wait instead.
    #
    # Serialized and bounded is all of it, though — NOT ordered. GitHub queues by the time a
    # run starts waiting, and states outright that ordering is not guaranteed, so two runs can
    # still invert and leave prod running the older commit under a HIGHER version number
    # (`push` patch-bumps the registry's highest; it never reads the commit). The release
    # step below closes that: it promotes only while its commit still owns the release —
    # checked against the branch tip right before the pointer move — so prod stays monotonic
    # in commits whatever order the queue resumes in.
    concurrency:
      group: substrat-deploy-drive-vertical-prod
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          # 22+: corepack resolves the latest pnpm for lockfile-only repos, and pnpm 11
          # needs Node >= 22.13 (node:sqlite).
          node-version: 22
      - name: Install dependencies
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi
      - name: Build workspace dependencies
        # Sibling packages resolve through their package.json exports, which point at dist/ —
        # a fresh checkout has none, and install links without building. pnpm and Yarn Berry
        # build in dependency order and skip packages without a build script (pnpm only the
        # closure this package imports). Yarn Classic and npm have no dependency order: Classic
        # runs every workspace's build and fails on one that has none; npm follows the order
        # package.json lists workspaces in, so list dependencies before dependents.
        # Delete this step if the package imports no workspace packages.
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm --filter "{apps/drive-vertical}^..." run --if-present build
          elif [ -f yarn.lock ] && ! yarn --version | grep -q '^1\.'; then yarn workspaces foreach --all --topological-dev --exclude 'apps/drive-vertical' run build
          elif [ -f yarn.lock ]; then yarn workspaces run build
          else npm run build --workspaces --if-present
          fi
      - name: Gate the push (typecheck, tests, layer rules)
        # Runs the gates apps/drive-vertical/package.json declares — a violation fails the job before anything
        # is uploaded. Add `test`, `typecheck` and `lint:boundaries` scripts to gate more;
        # `lint:boundaries` is `substrat-boundary-lint` from @substrat-run/boundary-lint.
        #
        # `lint:model` re-emits model.json and fails on drift, so a changed table or a renamed
        # field appears in the PR diff rather than in the dashboard's Model tab after a deploy.
        # It runs BEFORE the upload for that reason — push reads the checked-in artifact, so a
        # stale one ships silently and a missing one records no model at all.
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then PM=pnpm
          elif [ -f yarn.lock ]; then PM=yarn
          else PM=npm
          fi
          declares() { node -e "const s=require(process.cwd()+'/'+process.argv[1]).scripts||{};process.exit(s[process.argv[2]]?0:1)" 'apps/drive-vertical/package.json' "$1"; }
          RAN=''
          for s in typecheck test lint:model lint:boundaries; do
            if declares "$s"; then ( cd apps/drive-vertical && $PM run "$s" ); RAN="$RAN $s"
            else echo "no '$s' script in apps/drive-vertical/package.json — skipped"
            fi
          done
          if [ -z "$RAN" ]; then
            echo "::warning::no typecheck, test, lint:model or lint:boundaries script in apps/drive-vertical/package.json — this push is UNGATED. See https://substrat.net/guide/deploying"
          else
            echo "gates passed:$RAN"
          fi
      - name: Release to prod
        env:
          SUBSTRAT_SERVICE_TOKEN: ${{ secrets.SUBSTRAT_SERVICE_TOKEN }}
          SUBSTRAT_CP_URL: https://console.substrat.net/api
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ( cd apps/drive-vertical && npx @substrat-run/cli push . --slug drive-vertical ) | tee push.out
          VID=$(grep -F '✓ pushed' push.out | grep -oE 'version [A-Za-z0-9]+' | head -1 | cut -d' ' -f2 || true)
          if [ -z "$VID" ]; then echo "could not read the pushed version id from:" >&2; cat push.out >&2; exit 1; fi
          # Promote only while this commit is still the branch tip. Queued runs resume in
          # no guaranteed order, so a run holding an older commit can get here after a
          # newer one already promoted — and would point prod back at old code under a
          # higher version number. The version above is uploaded either way; only the
          # pointer move is skipped, because the tip commit's own run owns it.
          TIP=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$TIP" != "$GITHUB_SHA" ]; then
            echo "::warning::main has moved past $GITHUB_SHA (tip is $TIP) — pushed version $VID without promoting prod; the tip commit's run owns the pointer."
            exit 0
          fi
          npx @substrat-run/cli promote drive-vertical --version "$VID"
      - name: Update the test environment
        if: vars.SUBSTRAT_TEST_SCOPE_ID != ''
        env:
          SUBSTRAT_SERVICE_TOKEN: ${{ secrets.SUBSTRAT_SERVICE_TOKEN }}
          SUBSTRAT_CP_URL: https://console.substrat.net/api
          # Through env, not ${{ }} inside the script: an expression is substituted into the
          # script TEXT before bash parses it, so a variable containing shell syntax would run
          # as a command — here beside a live SUBSTRAT_SERVICE_TOKEN. A repository variable is
          # set by a maintainer rather than a stranger, which lowers the odds, not the rule.
          SUBSTRAT_TEST_SCOPE_ID: ${{ vars.SUBSTRAT_TEST_SCOPE_ID }}
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./apps/drive-vertical/package.json').version")
          ( cd apps/drive-vertical && npx @substrat-run/cli push . --slug drive-vertical --version "$BASE-test.${{ github.run_number }}" ) | tee push.out
          # '|| true' so an unmatched grep does not trip pipefail before the message below —
          # "could not read the pushed version id" beats a bare exit 1 from grep.
          VID=$(grep -F '✓ pushed' push.out | grep -oE 'version [A-Za-z0-9]+' | head -1 | cut -d' ' -f2 || true)
          if [ -z "$VID" ]; then echo "could not read the pushed version id from:" >&2; cat push.out >&2; exit 1; fi
          npx @substrat-run/cli scope bind "$SUBSTRAT_TEST_SCOPE_ID" --version "$VID" --snapshot

  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    # Never overlap two runs for the same PR — a rapid re-push waits for the first.
    concurrency: substrat-preview-${{ github.event.number }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          # 22+: corepack resolves the latest pnpm for lockfile-only repos, and pnpm 11
          # needs Node >= 22.13 (node:sqlite).
          node-version: 22
      - name: Install dependencies
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install
          fi
      - name: Build workspace dependencies
        # Sibling packages resolve through their package.json exports, which point at dist/ —
        # a fresh checkout has none, and install links without building. pnpm and Yarn Berry
        # build in dependency order and skip packages without a build script (pnpm only the
        # closure this package imports). Yarn Classic and npm have no dependency order: Classic
        # runs every workspace's build and fails on one that has none; npm follows the order
        # package.json lists workspaces in, so list dependencies before dependents.
        # Delete this step if the package imports no workspace packages.
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm --filter "{apps/drive-vertical}^..." run --if-present build
          elif [ -f yarn.lock ] && ! yarn --version | grep -q '^1\.'; then yarn workspaces foreach --all --topological-dev --exclude 'apps/drive-vertical' run build
          elif [ -f yarn.lock ]; then yarn workspaces run build
          else npm run build --workspaces --if-present
          fi
      - name: Gate the push (typecheck, tests, layer rules)
        # Runs the gates apps/drive-vertical/package.json declares — a violation fails the job before anything
        # is uploaded. Add `test`, `typecheck` and `lint:boundaries` scripts to gate more;
        # `lint:boundaries` is `substrat-boundary-lint` from @substrat-run/boundary-lint.
        #
        # `lint:model` re-emits model.json and fails on drift, so a changed table or a renamed
        # field appears in the PR diff rather than in the dashboard's Model tab after a deploy.
        # It runs BEFORE the upload for that reason — push reads the checked-in artifact, so a
        # stale one ships silently and a missing one records no model at all.
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then PM=pnpm
          elif [ -f yarn.lock ]; then PM=yarn
          else PM=npm
          fi
          declares() { node -e "const s=require(process.cwd()+'/'+process.argv[1]).scripts||{};process.exit(s[process.argv[2]]?0:1)" 'apps/drive-vertical/package.json' "$1"; }
          RAN=''
          for s in typecheck test lint:model lint:boundaries; do
            if declares "$s"; then ( cd apps/drive-vertical && $PM run "$s" ); RAN="$RAN $s"
            else echo "no '$s' script in apps/drive-vertical/package.json — skipped"
            fi
          done
          if [ -z "$RAN" ]; then
            echo "::warning::no typecheck, test, lint:model or lint:boundaries script in apps/drive-vertical/package.json — this push is UNGATED. See https://substrat.net/guide/deploying"
          else
            echo "gates passed:$RAN"
          fi
      - name: Create/update the preview
        env:
          SUBSTRAT_SERVICE_TOKEN: ${{ secrets.SUBSTRAT_SERVICE_TOKEN }}
          SUBSTRAT_CP_URL: https://console.substrat.net/api
        run: |
          set -euo pipefail
          ( cd apps/drive-vertical && npx @substrat-run/cli preview create . --slug drive-vertical --tag pr-${{ github.event.number }} ) | tee preview.out
          # Take the URL from the CLI success line (the ✓ marker) only — the push it runs
          # first also prints an https:// *deploy endpoint* we must never mistake for a preview.
          grep -F '✓ preview' preview.out | grep -oE 'https://[a-zA-Z0-9.:/_-]+' | tail -1 > preview.url || true
      - name: Create the per-build preview
        if: vars.SUBSTRAT_PER_BUILD_PREVIEW != ''
        env:
          SUBSTRAT_SERVICE_TOKEN: ${{ secrets.SUBSTRAT_SERVICE_TOKEN }}
          SUBSTRAT_CP_URL: https://console.substrat.net/api
        run: |
          set -euo pipefail
          # A FRESH scope, bound once and never rebound, so this URL is frozen to this build
          # forever. Clean-room (--empty) rather than a fork: a throwaway per build should not
          # copy prod data every push. Short TTL — the sticky preview is the one that lives.
          ( cd apps/drive-vertical && npx @substrat-run/cli preview create . --slug drive-vertical \
            --tag pr-${{ github.event.number }}-${{ github.run_id }} --empty --ttl 24h ) | tee build.out
          grep -F '✓ preview' build.out | grep -oE 'https://[a-zA-Z0-9.:/_-]+' | tail -1 > build.url || true
      - name: Comment the preview URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          URL=$(cat preview.url 2>/dev/null || true)
          [ -z "$URL" ] && exit 0
          BUILD=$(cat build.url 2>/dev/null || true)
          if [ -n "$BUILD" ]; then
            BODY=$(printf '<!-- substrat-preview -->\n🔎 **Substrat preview:** %s\n📌 **This build:** %s\n\n_The preview URL follows the PR — every push rebinds it, so it always serves the latest code. The build URL is frozen to this one build and never moves. Both are reaped when the PR closes._' "$URL" "$BUILD")
          else
            BODY=$(printf '<!-- substrat-preview -->\n🔎 **Substrat preview:** %s\n\n_Runs the code in this PR against a fork of prod, and follows the PR — every push rebinds it. Reaped when the PR closes._' "$URL")
          fi
          REPO=${{ github.repository }}
          PR=${{ github.event.number }}
          ID=$(gh api "repos/$REPO/issues/$PR/comments" --jq '.[] | select(.body | startswith("<!-- substrat-preview -->")) | .id' | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
          fi

  preview_cleanup:
    # Reap only — no repo build needed, so skip checkout/install and just run the CLI.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    concurrency: substrat-preview-${{ github.event.number }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Reap the preview
        env:
          SUBSTRAT_SERVICE_TOKEN: ${{ secrets.SUBSTRAT_SERVICE_TOKEN }}
          SUBSTRAT_CP_URL: https://console.substrat.net/api
        run: npx @substrat-run/cli preview delete --slug drive-vertical --tag pr-${{ github.event.number }}
