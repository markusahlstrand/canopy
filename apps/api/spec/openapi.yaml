                $ref: '#/components/schemas/SpaceMember'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSpaceMember'
    delete:
      operationId: removeMember
      description: Remove a member. Owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveSpaceMember'
  /api/spaces/{id}/plugins:
    get:
      operationId: listSpacePlugins
      description: Plugins applied to a space. Any member may read.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginIds'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: applySpacePlugin
      description: Apply a plugin to a space (turns it on for everyone). Owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pluginId:
                  type: string
              required:
                - pluginId
  /api/spaces/{id}/plugins/{pluginId}:
    delete:
      operationId: removeSpacePlugin
      description: Remove an applied plugin from a space. Owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/spaces/{id}/prefs:
    patch:
      operationId: setSpacePrefs
      description: Pin/unpin a space into "My Drive".
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpacePrefs'
  /api/spaces/{id}/shares:
    get:
      operationId: listSpaceShares
      description: List share links for a space, or a folder within it (`?path=`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShareInfo'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createSpaceShare
      description: Mint a share link for a space, or a folder within it (`path` in the body).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateShareResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShare'
  /api/tasks:
    get:
      operationId: listTasks
      description: Tasks from the caller's configured source (or the demo default).
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - {}
  /api/uploads/prepare:
    post:
      operationId: prepareUpload
      description: |-
        Reserve an upload for content-addressed bytes in a space. If a blob with this
        hash already exists, the response says so and the PUT can be skipped.
      parameters:
        - name: space
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareUpload'
  /api/uploads/{token}:
    put:
      operationId: commitUpload
      description: Stream bytes for a prepared upload. `token` is the claimed SHA-256, re-verified.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommittedBlob'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  /s/{secret}:
    get:
      operationId: openShare
      description: |-
        Public share landing — the secret in the path IS the credential. A file share
        streams the bytes; a folder/space share returns a read-only JSON listing.
        Access runs as the share's creator.
      parameters:
        - name: secret
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareListing'
            '*/*':
              schema:
                type: string
                format: binary
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - {}
security:
  - BearerAuth: []
components:
  schemas:
    AcceptInviteResult:
      type: object
      required:
        - spaceId
        - alreadyMember
      properties:
        spaceId:
          type: string
        alreadyMember:
          type: boolean
          description: True if the caller already had that role or better.
      description: Result of accepting an invite link.
    AcceptPendingResult:
      type: object
      required:
        - accepted
      properties:
        accepted:
          type: integer
          format: int32
          description: Count of spaces joined.
      description: Result of claiming all pending email invites.
    AddSpaceMember:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      description: Add a member to a space by email (they must have signed in once).
    AddVersion:
      type: object
      required:
        - hash
      properties:
        hash:
          type: string
          description: SHA-256 of the new bytes (its blob must be prepared/uploaded).
        mime:
          type: string
        coalesce:
          type: boolean
          description: Coalesce into the current version if the same author saved recently.
      description: Append a new content version to a file (never alters metadata).
    AiGenerateRequest:
      type: object
      required:
        - messages
      properties:
        model:
          type: string
          description: Model id from `/api/ai/models`; defaults to the first available.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AiMessage'
        temperature:
          type: number
          format: double
        maxTokens:
          type: integer
          format: int32
          description: Server caps this at 32768.
        json:
          type: boolean
          description: Request a strict-JSON reply where supported.
      description: Run inference through the caller's effective gateway.
    AiGenerateResult:
      type: object
      required:
        - text
        - model
      properties:
        text:
          type: string
          description: 'Generated text (a JSON string when `json: true` was requested).'
        model:
          type: string
          description: The model actually used.
      description: The generation result.
    AiImagePart:
      type: object
      required:
        - kind
        - mime
        - bytes
      properties:
        kind:
          type: string
          enum:
            - image
        mime:
          type: string
        bytes:
          type: string
          format: byte
    AiMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
            - user
            - assistant
        content:
          anyOf:
            - type: string
            - type: array
              items:
                anyOf:
                  - $ref: '#/components/schemas/AiTextPart'
                  - $ref: '#/components/schemas/AiImagePart'
      description: One chat message. A bare string `content` is shorthand for a single text part.
    AiModel:
      type: object
      required:
        - id
        - label
        - provider
      properties:
        id:
          type: string
        label:
          type: string
        provider:
          type: string
        vision:
          type: boolean
          description: True if the model accepts inline images/documents.
      description: A model the caller can run (base providers + their own UI-configured ones).
    AiTextPart:
      type: object
      required:
        - kind
        - text
      properties:
        kind:
          type: string
          enum:
            - text
        text:
          type: string
    AppPassword:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
      description: A device password for WebDAV / Basic-auth clients (the token is shown once).
    AppPasswordToken:
      type: object
      required:
        - id
        - token
      properties:
        id:
          type: string
        token:
          type: string
      description: A newly-minted app password — the plaintext token is returned ONCE.
    BranchInfo:
      type: object
      required:
        - name
        - isDefault
        - current
      properties:
        name:
          type: string
        isDefault:
          type: boolean
          description: This is HEAD — never deletable.
        current:
          type: boolean
          description: The connector is currently rooted here.
        protected:
          type: boolean
        commitSha:
          type: string
      description: One branch (ref) of a connected repo.
    BranchList:
      type: object
      required:
        - supported
        - branches
      properties:
        supported:
          type: boolean
        current:
          type: string
          nullable: true
        canSwitch:
          type: boolean
          description: Only the owner of the config can persist a switch.
        branches:
          type: array
          items:
            $ref: '#/components/schemas/BranchInfo'
      description: "The connected space's branches, or `supported: false` for a NAS with no branch concept."
    CalendarEvent:
      type: object
      required:
        - id
        - title
        - start
      properties:
        id:
          type: string
        title:
          type: string
        start:
          type: string
          description: ISO 8601 (date or date-time).
        end:
          type: string
          description: ISO 8601; omit for all-day / point-in-time events.
        allDay:
          type: boolean
        kind:
          type: string
          enum:
            - milestone
            - release
            - issue
            - event
        url:
          type: string
        tone:
          type: string
          description: Accent token.
      description: A calendar event surfaced by a data-source plugin.
    CalendarList:
      type: object
      required:
        - events
      properties:
        source:
          type: string
          nullable: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEvent'
      description: Events from the active source.
    ChangesPage:
      type: object
      required:
        - changes
        - cursor
        - hasMore
        - spaces
      properties:
        changes:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/MirrorFile'
              - $ref: '#/components/schemas/MirrorTombstone'
        cursor:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Per-space high-water seq map to send as the next `?since=`.
        hasMore:
          type: boolean
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/MirrorSpace'
      description: "A page of the offline-mirror delta: every file change since the caller's cursor."
    Comment:
      type: object
      required:
        - id
        - authorId
        - authorLabel
        - body
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        authorId:
          type: string
        authorLabel:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: A comment on a file, with a friendly author label resolved from the directory.
    CommittedBlob:
      type: object
      required:
        - hash
        - size
      properties:
        hash:
          type: string
        size:
          type: integer
          format: int64
      description: Result of streaming bytes to an upload ticket.
    ConfigField:
      type: object
      required:
        - key
        - label
        - type
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
            - string
            - secret
            - url
            - boolean
            - select
        required:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/ConfigFieldOption'
          description: Choices for a `select` field.
        optionsFrom:
          type: string
          enum:
            - ai-models
          description: Host fills options dynamically (today only "ai-models").
        showWhen:
          $ref: '#/components/schemas/ShowWhen'
      description: One schema-driven config field for a plugin/processor/AI provider.
    ConfigFieldOption:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
        label:
          type: string
      description: A choice for a `select`-typed config field.
    ConnectorSettings:
      type: object
      required:
        - policy
      properties:
        policy:
          $ref: '#/components/schemas/VersionPolicyKind'
        days:
          type: integer
          format: int32
          nullable: true
          description: Retained-day window when `policy` is `days`, else null.
      description: A connected space's version-retention policy.
    ConnectorStatus:
      type: object
      required:
        - indexing
        - pending
      properties:
        indexing:
          type: boolean
          description: True while a crawl runs or extraction drains.
        pending:
          type: integer
          format: int32
          description: Versions still queued for text extraction.
        lastIndexedAt:
          type: string
          format: date-time
          nullable: true
      description: Indexing state of a connected space (for the sidebar "Indexing…" hint).
    ContentSource:
      type: string
      enum:
        - blob
        - external
      description: "Where a version's bytes live: a blob Canopy owns, or a pointer into a connected store."
    CreateAppPassword:
      type: object
      properties:
        name:
          type: string
      description: Create an app password.
    CreateBranch:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        from:
          type: string
      description: Create a branch on the backend (from another ref, default = the current branch).
    CreateComment:
      type: object
      required:
        - body
      properties:
        body:
          type: string
      description: Post a comment.
    CreateCustomPlugin:
      type: object
      required:
        - manifest
        - source
      properties:
        manifest: {}
        source:
          type: string
      description: Submit a Studio-generated plugin (manifest + source).
    CreateFile:
      type: object
      required:
        - name
        - hash
      properties:
        name:
          type: string
        hash:
          type: string
          description: SHA-256 of the uploaded bytes — ties the record to its prepared blob.
        mime:
          type: string
        path:
          type: string
          description: Virtual-folder location within the space.
        metadata:
          type: object
          additionalProperties: {}
      description: Fields needed to create a file record once its blob has been uploaded.
    CreateFolder:
      type: object
      required:
        - path
      properties:
        path:
          type: string
      description: Create an (empty) folder in a space.
    CreateInvite:
      type: object
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/Role'
      description: Mint an invite link.
    CreateShare:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/Role'
        label:
          type: string
        path:
          type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
      description: Mint a share link. `path` (on a space) makes it a folder share.
    CreateShareResult:
      type: object
      required:
        - id
        - secret
      properties:
        id:
          type: string
        secret:
          type: string
          description: Plaintext capability secret; not recoverable later.
      description: Result of minting a share link — the secret is shown ONCE.
    CreateSpace:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
      description: Fields accepted when creating a shared (group) space.
    CustomPlugin:
      type: object
      required:
        - id
        - manifest
        - source
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        manifest:
          description: The parsed manifest (validated against the manifest schema on save).
        source:
          type: string
          description: ESM source for the sandboxed viewer/app entry.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: 'A runtime-authored (Plugin Studio) plugin: its manifest + sandboxed ESM source.'
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: HTTP-aligned error code.
        message:
          type: string
    File:
      type: object
      required:
        - id
        - ownerId
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        tenantId:
          type: string
          description: The owning space id (the tenant); equals the space the file lives in.
        ownerId:
          type: string
        name:
          type: string
        currentVersionId:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: {}
          description: Freeform JSON. `path` holds the virtual-folder location (e.g. "Documents/2026").
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the file is in the trash.
        version:
          type: object
          allOf:
            - $ref: '#/components/schemas/FileVersion'
          nullable: true
          description: The current version, joined in.
        sharedWith:
          type: array
          items:
            type: string
          description: Labels (emails / names / space names) the file is shared with, beyond its owner.
        ownerLabel:
          type: string
      description: |-
        A file: a mutable record that points at its current version, joined with that
        version. This is the display shape (`getFileForDisplay` / listings): the file
        record plus its current version, who it's shared with, and a friendly owner label.
    FileVersion:
      type: object
      required:
        - id
        - fileId
        - source
        - size
        - createdAt
        - createdBy
        - keep
      properties:
        id:
          type: string
        fileId:
          type: string
        source:
          $ref: '#/components/schemas/ContentSource'
        blobKey:
          type: string
          nullable: true
          description: Blob storage key (tenant-namespaced hash). Present iff `source` is `blob`.
        connectorId:
          type: string
          nullable: true
          description: Connection id when `source` is `external`, else null.
        externalKey:
          type: string
          nullable: true
          description: Object key in the connected store (external only).
        etag:
          type: string
          nullable: true
          description: Backend etag of the external object (external only).
        mime:
          type: string
          nullable: true
        size:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        keep:
          type: boolean
          description: 'Pinned: retention never prunes a kept version.'
        contentRef:
          type: string
          nullable: true
          description: R2 key of cached extracted text (external sources); null until the extract queue runs.
      description: Binds a file to its content at a point in time.
    Folder:
      type: object
      required:
        - name
        - path
      properties:
        name:
          type: string
        path:
          type: string
      description: A folder entry within a space.
    FolderGrantInput:
      type: object
      required:
        - path
        - subjectType
        - subjectId
        - role
      properties:
        path:
          type: string
        subjectType:
          $ref: '#/components/schemas/SubjectType'
        subjectId:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      description: Add/remove a grant on a folder (a space path + its subtree).
    Grant:
      type: object
      required:
        - objectType
        - objectId
        - relation
        - subjectType
        - subjectId
      properties:
        objectType:
          $ref: '#/components/schemas/ShareObjectType'
        objectId:
          type: string
        relation:
          type: string
          description: 'The granted role (the underlying relation: owner/editor/viewer).'
        subjectType:
          $ref: '#/components/schemas/SubjectType'
        subjectId:
          type: string
        subjectRelation:
          type: string
          description: '"" for a direct grant; "member" for a space-userset grant.'
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        picture:
          type: string
          nullable: true
      description: A direct ACL grant on a file or folder, enriched with the subject's directory info.
    GrantInput:
      type: object
      required:
        - subjectType
        - subjectId
        - role
      properties:
        subjectType:
          $ref: '#/components/schemas/SubjectType'
        subjectId:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        subjectRelation:
          type: string
      description: Add/remove a grant on a file. (For `email`, an unknown address becomes a pending invite.)
    Health:
      type: object
      required:
        - ok
        - drive
        - mounts
      properties:
        ok:
          type: boolean
        drive:
          type: boolean
        mounts:
          type: array
          items:
            type: string
      description: Liveness + which drive/mounts are configured.
    Integrations:
      type: object
      required:
        - sources
        - usingDefault
      properties:
        sources:
          type: array
          items:
            type: string
          description: Available data-source plugin ids (e.g. ["github"]).
        sourceId:
          type: string
          nullable: true
          description: The currently configured source, or null.
        repo:
          type: string
          nullable: true
        usingDefault:
          type: boolean
          description: True when falling back to the public demo default.
      description: What's connected for the caller (the integrations panel).
    InvitePreview:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/InviteStatus'
        spaceId:
          type: string
          description: Present when `status` is `valid`.
        spaceName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      description: Public preview of an invite link (no sign-in needed).
    InviteStatus:
      type: string
      enum:
        - valid
        - used
        - expired
        - not_found
      description: Whether an invite token can still be redeemed.
    KeepVersion:
      type: object
      required:
        - keep
      properties:
        keep:
          type: boolean
      description: Pin/unpin a version so retention never prunes it.
    Listing:
      type: object
      required:
        - path
        - files
        - folders
      properties:
        path:
          type: string
          description: The folder path that was listed (root = "").
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        folders:
          type: array
          items:
            $ref: '#/components/schemas/Folder'
        spaceName:
          type: string
          description: Present for connected spaces.
      description: "One folder's listing within a space: the files and subfolders at `path`."
    McpClient:
      type: object
      required:
        - clientId
        - firstSeenAt
        - lastSeenAt
      properties:
        clientId:
          type: string
        name:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
      description: An AI assistant that has connected over MCP (recorded as a side effect of requests).
    MirrorFile:
      type: object
      required:
        - id
        - spaceId
        - name
        - path
        - metadata
        - updatedAt
        - seq
      properties:
        id:
          type: string
        spaceId:
          type: string
        name:
          type: string
        path:
          type: string
          description: Virtual folder path, normalized.
        metadata:
          type: object
          additionalProperties: {}
        updatedAt:
          type: string
          format: date-time
        seq:
          type: integer
          format: int64
          description: Per-space change sequence.
        size:
          type: integer
          format: int64
          nullable: true
        mime:
          type: string
          nullable: true
        ownerLabel:
          type: string
        sharedWith:
          type: array
          items:
            type: string
      description: A live (upsert) file change in the offline-mirror delta.
    MirrorSpace:
      type: object
      required:
        - id
        - role
      properties:
        id:
          type: string
        role:
          type: string
        kind:
          type: string
      description: Which spaces a `/changes` page covers, with the caller's role + kind in each.
    MirrorTombstone:
      type: object
      required:
        - id
        - spaceId
        - seq
        - deleted
      properties:
        id:
          type: string
        spaceId:
          type: string
        seq:
          type: integer
          format: int64
        deleted:
          type: boolean
          enum:
            - true
      description: A delete (tombstone) change in the offline-mirror delta.
    Ok:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
      description: The generic success envelope returned by mutating routes that have no body.
    Overview:
      type: object
      required:
        - files
        - bytes
      properties:
        files:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
      description: Lightweight per-space stats for the dashboard.
    PendingInvite:
      type: object
      required:
        - spaceId
        - spaceName
        - role
      properties:
        spaceId:
          type: string
        spaceName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
      description: An email invite awaiting the caller's (verified) address.
    Person:
      type: object
      required:
        - sub
        - updatedAt
      properties:
        sub:
          type: string
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        picture:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
      description: A person the caller is connected to (space co-member or file-share peer).
    PluginIds:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
      description: A set of plugin ids (installed / active / a space's applied plugins).
    PluginPlace:
      type: object
      required:
        - spaceId
        - name
        - applied
      properties:
        spaceId:
          type: string
        name:
          type: string
        applied:
          type: boolean
      description: A group space a plugin can be applied to, flagged with whether it's applied there.
    PluginSettings:
      type: object
      required:
        - fields
        - values
        - secretsSet
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ConfigField'
        values:
          type: object
          additionalProperties:
            type: string
        secretsSet:
          type: array
          items:
            type: string
      description: |-
        A plugin's settings: the server-authoritative field schema, the caller's saved
        non-secret values, and which secret fields are set (secret values never leave the server).
    PluginTestResult:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        error:
          type: string
      description: Result of actively exercising a connector-backed plugin (a live root listing).
    PrepareUpload:
      type: object
      required:
        - hash
      properties:
        hash:
          type: string
          description: SHA-256 of the bytes to upload.
        size:
          type: integer
          format: int64
      description: Request to reserve an upload slot for content with the given hash.
    ProcessingRun:
      type: object
      required:
        - fileId
        - fileName
        - spaceName
        - at
        - plugin
        - status
      properties:
        fileId:
          type: string
        fileName:
          type: string
        spaceName:
          type: string
        at:
          type: string
          format: date-time
        plugin:
          type: string
          description: Processor id (e.g. "document-ai").
        status:
          type: string
          enum:
            - ok
            - error
        model:
          type: string
        labels:
          type: array
          items:
            type: string
        described:
          type: boolean
        note:
          type: string
      description: One processor run over a file, flattened from the file's metadata log. Newest first.
    RemoveSpaceMember:
      type: object
      required:
        - sub
      properties:
        sub:
          type: string
      description: Remove a member from a space.
    RenameSpace:
      type: object
      properties:
        name:
          type: string
      description: Patch body for renaming a space.
    Role:
      type: string
      enum:
        - owner
        - editor
        - viewer
      description: Resource-level role. owner ⊃ editor ⊃ viewer.
    SavePluginSettings:
      type: object
      required:
        - values
      properties:
        values:
          type: object
          additionalProperties:
            type: string
            nullable: true
      description: Save a plugin's settings. Omitted keys are unchanged; empty secret = keep existing.
    SearchHit:
      type: object
      required:
        - id
        - spaceId
        - score
        - title
      properties:
        id:
          type: string
        spaceId:
          type: string
        score:
          type: number
          format: double
        title:
          type: string
        snippet:
          type: string
        kind:
          type: string
        path:
          type: string
        modifiedAt:
          type: string
          format: date-time
      description: One full-text search hit, scored and scoped to the caller's readable spaces.
    SearchResults:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        cursor:
          type: string
          description: Present when more results are available.
      description: A page of search hits.
    SetConnectorSettings:
      type: object
      required:
        - versionPolicy
      properties:
        versionPolicy:
          $ref: '#/components/schemas/VersionPolicyKind'
        versionDays:
          type: integer
          format: int32
          nullable: true
      description: Update a connected space's version-retention policy.
    ShareInfo:
      type: object
      required:
        - id
        - objectType
        - spaceId
        - path
        - role
        - createdBy
        - createdAt
      properties:
        id:
          type: string
        objectType:
          $ref: '#/components/schemas/ShareObjectType'
        spaceId:
          type: string
        fileId:
          type: string
          nullable: true
          description: Non-null only for `file` shares.
        path:
          type: string
          description: Folder path for `folder` shares; "" otherwise.
        role:
          $ref: '#/components/schemas/Role'
        label:
          type: string
          nullable: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
      description: A share link's metadata (the secret itself is returned only once, on create).
    ShareListing:
      type: object
      required:
        - objectType
        - role
        - path
        - files
        - folders
      properties:
        objectType:
          $ref: '#/components/schemas/ShareObjectType'
        role:
          $ref: '#/components/schemas/Role'
        path:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        folders:
          type: array
          items:
            $ref: '#/components/schemas/Folder'
        spaceName:
          type: string
      description: "A folder/space share's public landing: a read-only listing plus the link's role."
    ShareObjectType:
      type: string
      enum:
        - file
        - folder
        - space
      description: What a share link points at.
    SharedFolder:
      type: object
      required:
        - spaceId
        - path
        - role
        - spaceName
      properties:
        spaceId:
          type: string
        path:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        spaceName:
          type: string
      description: A folder shared with the caller, enriched with its space name.
    ShowWhen:
      type: object
      required:
        - field
        - in
      properties:
        field:
          type: string
        in:
          type: array
          items:
            type: string
      description: "Conditional visibility: show this field only when another field's value is in `in`."
    Space:
      type: object
      required:
        - id
        - name
        - kind
        - role
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/SpaceKind'
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          description: The caller's role in this space.
        mounted:
          type: boolean
          description: Show inline in "My Drive" (always true for the personal space).
        readonly:
          type: boolean
          description: Read-only spaces (an indexed repo) refuse writes.
        icon:
          type: string
          nullable: true
          description: Optional sidebar icon name.
        color:
          type: string
          nullable: true
          description: Optional accent color — an HSL triplet like "145 33% 36%".
        createdBy:
          type: string
          description: Who created the space (absent on synthetic `connected` spaces).
        createdAt:
          type: string
          format: date-time
        versionPolicy:
          allOf:
            - $ref: '#/components/schemas/VersionPolicyKind'
          description: Retention policy for this space's file versions.
        versionDays:
          type: integer
          format: int32
          nullable: true
          description: Retained-day window when `versionPolicy` is `days`, else null.
      description: A space as returned to the caller, including their role in it.
    SpaceInvite:
      type: object
      required:
        - token
        - spaceId
        - role
        - createdBy
        - createdAt
      properties:
        token:
          type: string
        spaceId:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        acceptedBy:
          type: string
          nullable: true
        acceptedAt:
          type: string
          format: date-time
          nullable: true
      description: A single-use invite link with the role baked in.
    SpaceKind:
      type: string
      enum:
        - personal
        - group
        - connected
      description: |-
        A drive: one `personal` space per user, shared `group` spaces (e.g. a family),
        and read-only `connected` spaces — a persisted index over a user's connected
        backend (a Synology NAS, a GitHub repo).
    SpaceMember:
      type: object
      required:
        - sub
        - role
        - pending
      properties:
        sub:
          type: string
          description: The user's sub, or "" for a pending email invite.
        role:
          $ref: '#/components/schemas/Role'
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        pending:
          type: boolean
          description: True for an email invite not yet claimed.
      description: A member of a space (or a pending email invite resolved as a member row).
    SpacePrefs:
      type: object
      required:
        - mounted
      properties:
        mounted:
          type: boolean
      description: Pin/unpin a space into "My Drive".
    SubjectType:
      type: string
      enum:
        - user
        - space
        - email
      description: Who a grant/share is granted to.
    SwitchBranch:
      type: object
      required:
        - branch
      properties:
        branch:
          type: string
      description: Switch the branch the connected space is rooted at.
    Task:
      type: object
      required:
        - id
        - title
        - status
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
            - todo
            - in_progress
            - blocked
            - done
        assignee:
          type: string
        due:
          type: string
        labels:
          type: array
          items:
            type: string
        priority:
          type: string
          enum:
            - low
            - normal
            - high
        url:
          type: string
      description: A task surfaced by a data-source plugin.
    TaskList:
      type: object
      required:
        - tasks
      properties:
        source:
          type: string
          nullable: true
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
      description: Tasks from the active source.
    UploadTicket:
      type: object
      required:
        - exists
      properties:
        exists:
          type: boolean
          description: True when the content-addressed blob already exists — skip the PUT.
        upload:
          type: object
          properties:
            method:
              type: string
              enum:
                - PUT
            url:
              type: string
          required:
            - method
            - url
      description: Where (and whether) to upload. When `exists` is true the blob is already stored.
    VersionEntry:
      type: object
      required:
        - createdByLabel
      properties:
        createdByLabel:
          type: string
      allOf:
        - $ref: '#/components/schemas/FileVersion'
      description: A version in a file's history, with a friendly label for who created it.
    VersionPolicyKind:
      type: string
      enum:
        - all
        - smart
        - days
      description: |-
        Version-retention policy a space applies to its files' history. `smart` thins on a
        tiered curve (default), `all` keeps everything, `days` keeps only the last N days.
        The current + pinned versions survive any policy.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: /
    description: The Canopy API, mounted under /api by the worker.
    variables: {}
