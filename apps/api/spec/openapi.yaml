openapi: 3.0.0
info:
  title: Canopy Drive
  description: |-
    Canopy — an extensible, plugin-driven portal. This contract covers the full HTTP
    surface of the API worker: the DB-backed drive (spaces, files, versions, the
    content-addressed upload flow, full-text search), sharing (grants, share links,
    comments), space membership & invites, connected spaces (NAS/repo connectors,
    branches, indexing), the offline-mirror change feed, per-user plugin settings,
    Plugin Studio (custom plugins), AI inference, and the data-source plugins
    (tasks/calendar).

    Endpoints are bearer-authenticated unless marked `@useAuth(NoAuth)`; a few work
    anonymously to power the public demo. The personal space is implied when no
    `space` query is given. A connected space is addressed as `connector:<pluginId>`
    and is read-only unless its source plugin is writable (a NAS).

    The WebDAV mount (Basic auth, outside `/api`) and the MCP server (OAuth bearer,
    outside `/api`) are mounted by the worker but described elsewhere.
  version: 0.0.0
tags: []
paths:
  /api/ai/generate:
    post:
      operationId: generate
      description: Run inference through the caller's effective gateway (503 when none configured).
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGenerateResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiGenerateRequest'
  /api/ai/models:
    get:
      operationId: listAiModels
      description: Models available to the caller (base providers + their own UI-configured ones).
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/AiModel'
                required:
                  - models
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/app-passwords:
    get:
      operationId: listAppPasswords
      description: Device passwords for WebDAV / Basic-auth clients.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppPassword'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createAppPassword
      description: Create an app password — the plaintext token is returned ONCE.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppPasswordToken'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppPassword'
  /api/app-passwords/{id}:
    delete:
      operationId: deleteAppPassword
      description: Delete an app password.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/calendar:
    get:
      operationId: listCalendar
      description: Calendar events from the caller's configured source. `?from=`/`?to=` are ISO 8601.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: to
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - {}
  /api/changes:
    get:
      operationId: changesSince
      description: |-
        Offline-mirror delta: every file change in the caller's spaces since their
        cursor. `?since=` is a URL-encoded JSON `{spaceId: seq}` map (absent →
        bootstrap). `?limit=` caps the page.
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesPage'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/changes/stream:
    get:
      operationId: changesStream
      description: |-
        Live nudge: an SSE stream that emits a `bump` whenever the given space advances
        (`?space=`, default = personal). 204 when no live channel is bound (Node) — the
        client polls instead.
      parameters:
        - name: space
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            text/event-stream:
              schema:
                type: string
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/connector-files:
    put:
      operationId: uploadConnectorFile
      description: |-
        Upload bytes straight into a writable connected space (a NAS): write through
        the connector, reconcile the folder, and return the resulting indexed file.
        `?space=connector:<plugin>` + `?path=<space-relative path>`; body = raw bytes.
      parameters:
        - name: space
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: path
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/File'
                  - $ref: '#/components/schemas/Ok'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  /api/connector/{pluginId}/branch:
    put:
      operationId: switchBranch
      description: Switch the branch the connected space is rooted at (persist + re-index).
      parameters:
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  branch:
                    type: string
                required:
                  - ok
                  - branch
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchBranch'
  /api/connector/{pluginId}/branches:
    get:
      operationId: listBranches
      description: "List the connected space's branches (`supported: false` for a NAS)."
      parameters:
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createBranch
      description: Create a branch on the backend (needs a write token).
      parameters:
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranch'
    delete:
      operationId: deleteBranch
      description: Delete a branch on the backend. The name is a query param (`?name=`) for "/"-bearing refs.
      parameters:
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/connector/{pluginId}/logs/stream:
    get:
      operationId: connectorLogStream
      description: SSE stream of the connector crawl's progress lines (204 without a live channel).
      parameters:
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            text/event-stream:
              schema:
                type: string
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/connector/{pluginId}/settings:
    get:
      operationId: getConnectorSettings
      description: Read the connected space's version-retention policy.
      parameters:
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorSettings'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: setConnectorSettings
      description: Update the connected space's version-retention policy.
      parameters:
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorSettings'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetConnectorSettings'
  /api/connector/{pluginId}/status:
    get:
      operationId: connectorStatus
      description: Indexing state of a connected space (sidebar polls this).
      parameters:
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorStatus'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/connector/{pluginId}/sync:
    post:
      operationId: syncConnector
      description: Force a (re-)index of a connected space ("Sync now"); backgrounded.
      parameters:
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  started:
                    type: boolean
                required:
                  - started
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/file:
    get:
      operationId: readMountFile
      description: |-
        Read one file's bytes from a read-only mount (`?mount=`) or a connected space
        (`?space=connector:<plugin>`). `?download` forces a save dialog. Legacy
        path-based shape kept for the Documentation plugin.
      parameters:
        - name: mount
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: space
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: path
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: download
          in: query
          required: false
          schema:
            type: boolean
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - {}
  /api/files:
    get:
      operationId: listFiles
      description: |-
        List one folder. Defaults to the personal space root. `?mount=` reads a
        read-only mount; `?space=connector:<plugin>` a connected space (reconciled on
        view, `?fresh` bypasses the debounce); `?shared` files shared with me;
        `?trash` the trash; otherwise `?space=` + `?path=`.
      parameters:
        - name: mount
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: space
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: path
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: fresh
          in: query
          required: false
          schema:
            type: boolean
          explode: false
        - name: trash
          in: query
          required: false
          schema:
            type: boolean
          explode: false
        - name: shared
          in: query
          required: false
          schema:
            type: boolean
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createFile
      description: |-
        Create a file record plus its first version. The blob must already be prepared
        and uploaded (see `prepareUpload` / `commitUpload`). Runs AI labeling in the
        background.
      parameters:
        - name: space
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFile'
  /api/files/{id}:
    get:
      operationId: getFile
      description: Fetch a single file (joined with its current version) for display.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteFile
      description: Move a file to the trash (soft delete), or `?permanent` to purge it + its content.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: permanent
          in: query
          required: false
          schema:
            type: boolean
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/files/{id}/comments:
    get:
      operationId: listComments
      description: A file's comments, oldest first.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: addComment
      description: Post a comment. Anyone who can see the file (viewer+) may comment.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComment'
  /api/files/{id}/comments/{commentId}:
    delete:
      operationId: deleteComment
      description: Soft-delete a comment (author or file owner only).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/files/{id}/content:
    get:
      operationId: getFileContent
      description: |-
        Download the current version's bytes. Serves an `ETag` and honors
        `If-None-Match` (→ 304). `?download` forces a save dialog.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: download
          in: query
          required: false
          schema:
            type: boolean
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          headers:
            e-tag:
              required: true
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/files/{id}/grants:
    get:
      operationId: listGrants
      description: Direct grants on a file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Grant'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: shareGrant
      description: Add a grant on a file. (`email` subjects unknown to the directory become pending invites.)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
    delete:
      operationId: unshareGrant
      description: Remove a grant on a file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
  /api/files/{id}/metadata:
    patch:
      operationId: updateFileMetadata
      description: Patch a file's freeform metadata (e.g. move it by changing `path`). Never versions.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
  /api/files/{id}/restore:
    post:
      operationId: restoreFile
      description: Restore a trashed file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/files/{id}/shares:
    get:
      operationId: listFileShares
      description: List share links for a file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShareInfo'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createFileShare
      description: Mint a share link for a file (the secret is returned once).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateShareResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShare'
  /api/files/{id}/uploads/prepare:
    post:
      operationId: prepareFileUpload
      description: Reserve a blob for this file's next version, keyed to the file's space.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicket'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
